<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoType Quick Picker</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-drag: none;
      }

      body {
        background: transparent;
        color: #f4f4f5;
        font-family:
          "Segoe UI Variable Text",
          "Segoe UI",
          -apple-system,
          BlinkMacSystemFont,
          Roboto,
          sans-serif;
        font-size: 13px;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
        display: flex;
      }

      .picker-container {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        background: rgba(24, 24, 27, 0.96);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 10px;
        box-shadow:
          0 16px 40px rgba(0, 0, 0, 0.65),
          0 0 1px rgba(255, 255, 255, 0.2);
        overflow: hidden;
      }

      /* Header */
      .header-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 12px;
        background: rgba(255, 255, 255, 0.04);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        gap: 8px;
      }

      .target-badge {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11.5px;
        color: #a1a1aa;
        min-width: 0;
        flex: 1;
      }

      .target-icon {
        font-size: 13px;
        flex-shrink: 0;
      }

      .proc-name {
        background: rgba(59, 130, 246, 0.2);
        color: #60a5fa;
        padding: 1px 6px;
        border-radius: 4px;
        font-weight: 600;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        flex-shrink: 0;
      }

      .title-text {
        color: #d4d4d8;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        flex: 1;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }

      .tcato-badge {
        display: none;
        align-items: center;
        gap: 4px;
        font-size: 10.5px;
        padding: 1px 6px;
        border-radius: 4px;
        background: rgba(16, 185, 129, 0.2);
        color: #34d399;
        font-weight: 500;
      }

      .tcato-badge.visible {
        display: flex;
      }

      .close-btn {
        background: transparent;
        border: none;
        color: #a1a1aa;
        font-size: 13px;
        cursor: pointer;
        padding: 2px 6px;
        border-radius: 4px;
        line-height: 1;
        transition:
          background 0.1s,
          color 0.1s;
      }

      .close-btn:hover {
        background: rgba(255, 255, 255, 0.12);
        color: #ffffff;
      }

      /* Search bar */
      .search-bar {
        position: relative;
        display: flex;
        align-items: center;
        padding: 10px 14px;
        background: rgba(0, 0, 0, 0.2);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        gap: 10px;
      }

      .search-icon {
        font-size: 14px;
        opacity: 0.6;
        flex-shrink: 0;
      }

      .search-input {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        color: #f4f4f5;
        font-size: 14px;
        font-family: inherit;
      }

      .search-input::placeholder {
        color: #71717a;
      }

      .clear-search-btn {
        display: none;
        background: transparent;
        border: none;
        color: #71717a;
        font-size: 12px;
        cursor: pointer;
        padding: 2px 6px;
        border-radius: 4px;
      }

      .clear-search-btn:hover {
        color: #f4f4f5;
      }

      /* Results list */
      .results-list {
        flex: 1;
        overflow-y: auto;
        padding: 6px 8px;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .results-list::-webkit-scrollbar {
        width: 6px;
      }

      .results-list::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 3px;
      }

      .cipher-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border-radius: 6px;
        cursor: pointer;
        background: transparent;
        border: 1px solid transparent;
        transition:
          background 0.08s,
          border-color 0.08s;
        outline: none;
      }

      .cipher-item:hover,
      .cipher-item.is-selected {
        background: rgba(59, 130, 246, 0.16);
        border-color: rgba(59, 130, 246, 0.45);
      }

      .item-icon-box {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.06);
        font-size: 14px;
        flex-shrink: 0;
      }

      .item-details {
        flex: 1;
        min-width: 0;
      }

      .title-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .item-name {
        font-size: 13.5px;
        font-weight: 600;
        color: #f4f4f5;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .match-badge {
        font-size: 10.5px;
        padding: 1px 6px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.08);
        color: #a1a1aa;
        flex-shrink: 0;
        font-weight: 500;
      }

      .match-badge.badge-proc {
        background: rgba(16, 185, 129, 0.2);
        color: #34d399;
      }

      .match-badge.badge-title {
        background: rgba(168, 85, 247, 0.2);
        color: #c084fc;
      }

      .sub-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11.5px;
        color: #71717a;
        margin-top: 2px;
      }

      .item-username {
        color: #93c5fd;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        max-width: 180px;
      }

      .item-sequence {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        background: rgba(255, 255, 255, 0.05);
        padding: 0 4px;
        border-radius: 3px;
        font-size: 10px;
        color: #a1a1aa;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .action-hint {
        font-size: 11px;
        color: #60a5fa;
        opacity: 0;
        flex-shrink: 0;
        font-weight: 500;
        transition: opacity 0.08s;
      }

      .cipher-item.is-selected .action-hint {
        opacity: 1;
      }

      /* Empty state */
      .state-message {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 16px;
        text-align: center;
        color: #71717a;
        gap: 6px;
      }

      .empty-icon {
        font-size: 28px;
        margin-bottom: 4px;
      }

      .empty-title {
        font-size: 14px;
        font-weight: 500;
        color: #a1a1aa;
      }

      .empty-subtitle {
        font-size: 12px;
        color: #71717a;
      }

      /* Footer */
      .footer-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 14px;
        background: rgba(0, 0, 0, 0.35);
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        font-size: 11px;
        color: #71717a;
      }

      .hints-group {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .hint-item {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      kbd {
        display: inline-block;
        padding: 1px 5px;
        font-size: 10px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        background: rgba(255, 255, 255, 0.1);
        color: #d4d4d8;
        border-radius: 3px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: 0 1px 1px rgba(0, 0, 0, 0.3);
      }

      .kbd-enter {
        background: #2563eb;
        color: #ffffff;
        border-color: #3b82f6;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="picker-container">
      <!-- Header -->
      <div class="header-bar">
        <div class="target-badge">
          <span class="target-icon">🎯</span>
          <span id="targetProc" class="proc-name">app.exe</span>
          <span id="targetTitle" class="title-text">Целевое окно</span>
        </div>
        <div class="header-actions">
          <div id="tcatoBadge" class="tcato-badge">🛡️ TCATO</div>
          <button id="closeBtn" class="close-btn" title="Закрыть (Esc)">✕</button>
        </div>
      </div>

      <!-- Search Input -->
      <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input
          id="searchInput"
          class="search-input"
          type="text"
          placeholder="Поиск по логину, названию или сайту..."
          autocomplete="off"
          spellcheck="false"
        />
        <button id="clearSearchBtn" class="clear-search-btn">✕</button>
      </div>

      <!-- Results list -->
      <div id="resultsList" class="results-list"></div>

      <!-- Footer -->
      <div class="footer-bar">
        <div class="hints-group">
          <span class="hint-item"><kbd>↑</kbd><kbd>↓</kbd> выбор</span>
          <span class="hint-item"><kbd class="kbd-enter">Enter</kbd> ввести</span>
          <span class="hint-item"><kbd>Esc</kbd> отмена</span>
        </div>
        <div id="statusCount">0 аккаунтов</div>
      </div>
    </div>

    <script>
      (function () {
        let allItems = [];
        let filteredItems = [];
        let selectedIndex = 0;
        let targetWindow = null;
        let mode = "picker";

        const searchInput = document.getElementById("searchInput");
        const clearSearchBtn = document.getElementById("clearSearchBtn");
        const resultsList = document.getElementById("resultsList");
        const targetProc = document.getElementById("targetProc");
        const targetTitle = document.getElementById("targetTitle");
        const tcatoBadge = document.getElementById("tcatoBadge");
        const closeBtn = document.getElementById("closeBtn");
        const statusCount = document.getElementById("statusCount");

        function renderItems() {
          resultsList.innerHTML = "";

          if (filteredItems.length === 0) {
            resultsList.innerHTML = `
            <div class="state-message">
              <div class="empty-icon">🔍</div>
              <div class="empty-title">Ничего не найдено</div>
              <div class="empty-subtitle">Попробуйте ввести другой поисковый запрос</div>
            </div>
          `;
            statusCount.textContent = "0 найдено";
            return;
          }

          statusCount.textContent = `${filteredItems.length} найдено`;

          filteredItems.forEach((item, index) => {
            const row = document.createElement("div");
            row.className = "cipher-item" + (index === selectedIndex ? " is-selected" : "");
            row.dataset.index = index;

            let badgeHtml = "";
            if (item.matchBadge) {
              const badgeClass =
                item.matchType === "process"
                  ? "badge-proc"
                  : item.matchType === "title"
                    ? "badge-title"
                    : "";
              badgeHtml = `<span class="match-badge ${badgeClass}">${escapeHtml(item.matchBadge)}</span>`;
            }

            row.innerHTML = `
            <div class="item-icon-box">🔑</div>
            <div class="item-details">
              <div class="title-row">
                <span class="item-name">${escapeHtml(item.name || "Без названия")}</span>
                ${badgeHtml}
              </div>
              <div class="sub-row">
                <span class="item-username">${escapeHtml(item.username || "Без логина")}</span>
                <span class="item-sequence">${escapeHtml(item.sequencePreview || "{USERNAME} ⇥ {PASSWORD} ↵")}</span>
              </div>
            </div>
            <span class="action-hint">↵ Ввести</span>
          `;

            row.addEventListener("click", () => {
              selectItem(index);
            });

            resultsList.appendChild(row);
          });

          scrollToSelected();
        }

        function scrollToSelected() {
          const selectedEl = resultsList.querySelector(".cipher-item.is-selected");
          if (selectedEl) {
            selectedEl.scrollIntoView({ block: "nearest" });
          }
        }

        function applyFilter() {
          const q = searchInput.value.trim().toLowerCase();

          if (!q) {
            if (mode === "picker") {
              // In picker mode, show matched items first; if none, show all
              const matches = allItems.filter(
                (i) => i.matchType === "process" || i.matchType === "title",
              );
              filteredItems = matches.length > 0 ? matches : [...allItems];
            } else {
              filteredItems = [...allItems];
            }
          } else {
            filteredItems = allItems.filter((i) => {
              return (
                (i.name && i.name.toLowerCase().includes(q)) ||
                (i.username && i.username.toLowerCase().includes(q)) ||
                (i.matchBadge && i.matchBadge.toLowerCase().includes(q))
              );
            });
          }

          selectedIndex = 0;
          renderItems();
        }

        function selectItem(index) {
          const item = filteredItems[index];
          if (!item) return;

          if (window.ipc?.autofill?.autotypeMvp?.selectPicker) {
            window.ipc.autofill.autotypeMvp.selectPicker({ cipherId: item.id });
          }
        }

        function closePicker() {
          if (window.ipc?.autofill?.autotypeMvp?.closePicker) {
            window.ipc.autofill.autotypeMvp.closePicker();
          }
        }

        function escapeHtml(str) {
          if (!str) return "";
          return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
        }

        // Event Listeners
        searchInput.addEventListener("input", () => {
          clearSearchBtn.style.display = searchInput.value ? "block" : "none";
          applyFilter();
        });

        clearSearchBtn.addEventListener("click", () => {
          searchInput.value = "";
          clearSearchBtn.style.display = "none";
          searchInput.focus();
          applyFilter();
        });

        closeBtn.addEventListener("click", closePicker);

        window.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            e.preventDefault();
            closePicker();
            return;
          }

          if (e.key === "ArrowDown") {
            e.preventDefault();
            if (filteredItems.length > 0) {
              selectedIndex = (selectedIndex + 1) % filteredItems.length;
              updateSelection();
            }
            return;
          }

          if (e.key === "ArrowUp") {
            e.preventDefault();
            if (filteredItems.length > 0) {
              selectedIndex = (selectedIndex - 1 + filteredItems.length) % filteredItems.length;
              updateSelection();
            }
            return;
          }

          if (e.key === "Enter") {
            e.preventDefault();
            if (
              filteredItems.length > 0 &&
              selectedIndex >= 0 &&
              selectedIndex < filteredItems.length
            ) {
              selectItem(selectedIndex);
            }
          }
        });

        function updateSelection() {
          const items = resultsList.querySelectorAll(".cipher-item");
          items.forEach((el, idx) => {
            if (idx === selectedIndex) {
              el.classList.add("is-selected");
            } else {
              el.classList.remove("is-selected");
            }
          });
          scrollToSelected();
        }

        // IPC initialization listener
        if (window.ipc?.autofill?.autotypeMvp?.onPickerInitData) {
          window.ipc.autofill.autotypeMvp.onPickerInitData((data) => {
            targetWindow = data.targetWindow || null;
            mode = data.mode || "picker";
            allItems = data.items || [];

            if (targetWindow) {
              targetProc.textContent = targetWindow.processName || "Процесс";
              targetTitle.textContent = targetWindow.windowTitle || "Целевое окно";
              targetProc.style.display = targetWindow.processName ? "inline-block" : "none";
            } else {
              targetProc.textContent = "";
              targetTitle.textContent = "AutoType Spotlight";
            }

            if (data.useTcato) {
              tcatoBadge.classList.add("visible");
            } else {
              tcatoBadge.classList.remove("visible");
            }

            searchInput.value = data.initialQuery || "";
            clearSearchBtn.style.display = searchInput.value ? "block" : "none";

            applyFilter();

            setTimeout(() => {
              searchInput.focus();
              searchInput.select();
            }, 30);
          });
        }
      })();
    </script>
  </body>
</html>
