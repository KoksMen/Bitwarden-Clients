<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoType Quick Picker</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-drag: none;
      }

      body {
        background: transparent;
        color: #f4f4f5;
        font-family:
          "Segoe UI Variable Text",
          "Segoe UI",
          -apple-system,
          BlinkMacSystemFont,
          Roboto,
          sans-serif;
        font-size: 13px;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
        display: flex;
      }

      .picker-container {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        background: rgba(24, 24, 27, 0.96);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 10px;
        box-shadow:
          0 16px 40px rgba(0, 0, 0, 0.65),
          0 0 1px rgba(255, 255, 255, 0.2);
        overflow: hidden;
        position: relative;
      }

      /* Header */
      .header-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 12px;
        background: rgba(255, 255, 255, 0.04);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        gap: 8px;
      }

      .target-badge {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11.5px;
        color: #a1a1aa;
        min-width: 0;
        flex: 1;
      }

      .target-icon {
        font-size: 13px;
        flex-shrink: 0;
      }

      .proc-name {
        background: rgba(59, 130, 246, 0.2);
        color: #60a5fa;
        padding: 1px 6px;
        border-radius: 4px;
        font-weight: 600;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        flex-shrink: 0;
      }

      .title-text {
        color: #d4d4d8;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        flex: 1;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }

      .tcato-badge {
        display: none;
        align-items: center;
        gap: 4px;
        font-size: 10.5px;
        padding: 1px 6px;
        border-radius: 4px;
        background: rgba(16, 185, 129, 0.2);
        color: #34d399;
        font-weight: 500;
      }

      .tcato-badge.visible {
        display: flex;
      }

      .close-btn {
        background: transparent;
        border: none;
        color: #a1a1aa;
        font-size: 14px;
        cursor: pointer;
        width: 22px;
        height: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 4px;
        transition:
          background 0.1s,
          color 0.1s;
      }

      .close-btn:hover {
        background: rgba(239, 68, 68, 0.2);
        color: #f87171;
      }

      /* Search bar */
      .search-bar {
        display: flex;
        align-items: center;
        padding: 8px 12px;
        background: rgba(255, 255, 255, 0.02);
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        gap: 8px;
        position: relative;
      }

      .search-icon {
        font-size: 14px;
        color: #71717a;
        flex-shrink: 0;
      }

      .search-input {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        color: #f4f4f5;
        font-family: inherit;
        font-size: 13.5px;
        min-width: 0;
        user-select: text;
      }

      .search-input::placeholder {
        color: #71717a;
      }

      .clear-search-btn {
        background: transparent;
        border: none;
        color: #71717a;
        cursor: pointer;
        font-size: 12px;
        padding: 2px 6px;
        border-radius: 4px;
        display: none;
      }

      .clear-search-btn:hover {
        color: #f4f4f5;
        background: rgba(255, 255, 255, 0.08);
      }

      /* Results list */
      .results-list {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 6px;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .results-list::-webkit-scrollbar {
        width: 6px;
      }

      .results-list::-webkit-scrollbar-track {
        background: transparent;
      }

      .results-list::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 3px;
      }

      .results-list::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.25);
      }

      .cipher-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 7px 10px;
        border-radius: 6px;
        cursor: pointer;
        background: transparent;
        border: 1px solid transparent;
        transition:
          background 0.08s,
          border-color 0.08s;
        outline: none;
        position: relative;
      }

      .cipher-item:hover,
      .cipher-item.is-selected {
        background: rgba(59, 130, 246, 0.14);
        border-color: rgba(59, 130, 246, 0.4);
      }

      .item-icon-box {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.06);
        font-size: 14px;
        flex-shrink: 0;
      }

      .item-details {
        flex: 1;
        min-width: 0;
      }

      .title-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .item-name {
        font-size: 13.5px;
        font-weight: 600;
        color: #f4f4f5;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .match-badge {
        font-size: 10px;
        padding: 1px 5px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.08);
        color: #a1a1aa;
        flex-shrink: 0;
        font-weight: 500;
      }

      .match-badge.badge-proc {
        background: rgba(16, 185, 129, 0.2);
        color: #34d399;
      }

      .match-badge.badge-title {
        background: rgba(168, 85, 247, 0.2);
        color: #c084fc;
      }

      .sub-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11.5px;
        color: #71717a;
        margin-top: 2px;
      }

      .item-username {
        color: #93c5fd;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        max-width: 170px;
      }

      .item-sequence {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        background: rgba(255, 255, 255, 0.05);
        padding: 0 4px;
        border-radius: 3px;
        font-size: 10px;
        color: #a1a1aa;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        max-width: 140px;
      }

      /* Quick Action Buttons on row */
      .item-actions {
        display: flex;
        align-items: center;
        gap: 3px;
        flex-shrink: 0;
        opacity: 0.35;
        transition: opacity 0.1s ease;
      }

      .cipher-item:hover .item-actions,
      .cipher-item.is-selected .item-actions {
        opacity: 1;
      }

      .action-btn {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: #e4e4e7;
        font-size: 12px;
        width: 26px;
        height: 26px;
        border-radius: 5px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.1s ease;
        position: relative;
      }

      .action-btn:hover {
        background: rgba(59, 130, 246, 0.35);
        border-color: rgba(96, 165, 250, 0.6);
        color: #ffffff;
        transform: scale(1.08);
      }

      .action-btn.btn-autotype:hover {
        background: rgba(16, 185, 129, 0.35);
        border-color: rgba(52, 211, 153, 0.6);
      }

      .action-btn.btn-edit:hover {
        background: rgba(168, 85, 247, 0.35);
        border-color: rgba(192, 132, 252, 0.6);
      }

      /* Empty state */
      .state-message {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 16px;
        text-align: center;
        color: #71717a;
        gap: 6px;
      }

      .empty-icon {
        font-size: 28px;
        margin-bottom: 4px;
      }

      .empty-title {
        font-size: 14px;
        font-weight: 500;
        color: #a1a1aa;
      }

      .empty-subtitle {
        font-size: 12px;
        color: #71717a;
      }

      /* Footer */
      .footer-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 7px 12px;
        background: rgba(0, 0, 0, 0.4);
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        font-size: 11px;
        color: #71717a;
      }

      .hints-group {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .hint-item {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      kbd {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 3px;
        padding: 1px 4px;
        font-size: 10px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        color: #d4d4d8;
      }

      kbd.kbd-enter {
        background: rgba(59, 130, 246, 0.2);
        border-color: rgba(59, 130, 246, 0.4);
        color: #93c5fd;
      }

      /* Custom Right-Click Context Menu */
      .context-menu {
        position: fixed;
        z-index: 10000;
        background: rgba(24, 24, 27, 0.98);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        box-shadow:
          0 12px 32px rgba(0, 0, 0, 0.75),
          0 0 1px rgba(255, 255, 255, 0.25);
        padding: 4px;
        min-width: 220px;
        display: none;
        flex-direction: column;
        gap: 2px;
      }

      .context-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 6px 10px;
        border-radius: 5px;
        font-size: 12.5px;
        color: #f4f4f5;
        cursor: pointer;
        transition: background 0.08s;
      }

      .context-item:hover {
        background: rgba(59, 130, 246, 0.25);
        color: #ffffff;
      }

      .context-left {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .context-icon {
        font-size: 13px;
        width: 16px;
        text-align: center;
      }

      .context-kbd {
        font-size: 10px;
        color: #a1a1aa;
      }

      .context-divider {
        height: 1px;
        background: rgba(255, 255, 255, 0.08);
        margin: 3px 0;
      }

      /* Toast Notification Pill */
      .toast-pill {
        position: absolute;
        bottom: 42px;
        left: 50%;
        transform: translateX(-50%) translateY(16px);
        background: rgba(30, 41, 59, 0.96);
        border: 1px solid rgba(59, 130, 246, 0.5);
        color: #93c5fd;
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 11.5px;
        font-weight: 500;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: center;
        gap: 6px;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.16s ease,
          transform 0.16s ease;
        z-index: 1000;
      }

      .toast-pill.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      .toast-pill.toast-error {
        background: rgba(69, 10, 10, 0.96);
        border-color: rgba(239, 68, 68, 0.5);
        color: #fca5a5;
      }
    </style>
  </head>
  <body>
    <div class="picker-container">
      <!-- Header -->
      <div class="header-bar">
        <div class="target-badge">
          <span class="target-icon">🎯</span>
          <span id="targetProc" class="proc-name"></span>
          <span id="targetTitle" class="title-text">AutoType Quick Picker</span>
        </div>
        <div class="header-actions">
          <span id="tcatoBadge" class="tcato-badge" title="Защита от кейлоггеров активна">
            🛡️ TCATO
          </span>
          <button id="closeBtn" class="close-btn" title="Закрыть (Esc)">✕</button>
        </div>
      </div>

      <!-- Search input -->
      <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="Поиск по аккаунтам, логину или приложению..."
          autocomplete="off"
          spellcheck="false"
        />
        <button id="clearSearchBtn" class="clear-search-btn">✕</button>
      </div>

      <!-- Results list -->
      <div id="resultsList" class="results-list"></div>

      <!-- Footer -->
      <div class="footer-bar">
        <div class="hints-group">
          <span class="hint-item"><kbd class="kbd-enter">↵</kbd> ввод</span>
          <span class="hint-item"><kbd>Ctrl+B</kbd> логин</span>
          <span class="hint-item"><kbd>Ctrl+C</kbd> пароль</span>
          <span class="hint-item"><kbd>Ctrl+T</kbd> TOTP</span>
          <span class="hint-item"><kbd>Ctrl+E</kbd> изменить</span>
          <span class="hint-item"><kbd>ПКМ</kbd> меню</span>
        </div>
        <div id="statusCount">0 аккаунтов</div>
      </div>

      <!-- Floating Toast Notification -->
      <div id="toastPill" class="toast-pill">
        <span id="toastIcon">✓</span>
        <span id="toastMsg">Логин скопирован</span>
      </div>

      <!-- Custom Right-Click Context Menu -->
      <div id="contextMenu" class="context-menu">
        <div class="context-item" data-action="autotype">
          <div class="context-left">
            <span class="context-icon">⌨️</span>
            <span>Автонабор</span>
          </div>
          <kbd class="context-kbd">Enter</kbd>
        </div>
        <div class="context-divider"></div>
        <div class="context-item" data-action="copy-username">
          <div class="context-left">
            <span class="context-icon">👤</span>
            <span>Скопировать логин</span>
          </div>
          <kbd class="context-kbd">Ctrl+B</kbd>
        </div>
        <div class="context-item" data-action="copy-password">
          <div class="context-left">
            <span class="context-icon">🔑</span>
            <span>Скопировать пароль</span>
          </div>
          <kbd class="context-kbd">Ctrl+C</kbd>
        </div>
        <div class="context-item" id="ctxTotp" data-action="copy-totp">
          <div class="context-left">
            <span class="context-icon">⏳</span>
            <span>Скопировать код TOTP</span>
          </div>
          <kbd class="context-kbd">Ctrl+T</kbd>
        </div>
        <div class="context-item" id="ctxUrl" data-action="copy-url">
          <div class="context-left">
            <span class="context-icon">🔗</span>
            <span>Скопировать URL</span>
          </div>
          <kbd class="context-kbd">Ctrl+U</kbd>
        </div>
        <div class="context-divider"></div>
        <div class="context-item" data-action="edit">
          <div class="context-left">
            <span class="context-icon">✏️</span>
            <span>Редактировать запись</span>
          </div>
          <kbd class="context-kbd">Ctrl+E</kbd>
        </div>
      </div>
    </div>

    <script>
      (function () {
        let allItems = [];
        let filteredItems = [];
        let selectedIndex = 0;
        let targetWindow = null;
        let mode = "picker";
        let toastTimeout = null;

        const searchInput = document.getElementById("searchInput");
        const clearSearchBtn = document.getElementById("clearSearchBtn");
        const resultsList = document.getElementById("resultsList");
        const targetProc = document.getElementById("targetProc");
        const targetTitle = document.getElementById("targetTitle");
        const tcatoBadge = document.getElementById("tcatoBadge");
        const closeBtn = document.getElementById("closeBtn");
        const statusCount = document.getElementById("statusCount");
        const toastPill = document.getElementById("toastPill");
        const toastIcon = document.getElementById("toastIcon");
        const toastMsg = document.getElementById("toastMsg");
        const contextMenu = document.getElementById("contextMenu");
        const ctxTotp = document.getElementById("ctxTotp");
        const ctxUrl = document.getElementById("ctxUrl");

        function showToast(message, isSuccess = true) {
          if (toastTimeout) {
            clearTimeout(toastTimeout);
          }
          toastMsg.textContent = message;
          toastIcon.textContent = isSuccess ? "✓" : "✕";
          if (isSuccess) {
            toastPill.classList.remove("toast-error");
          } else {
            toastPill.classList.add("toast-error");
          }
          toastPill.classList.add("show");
          toastTimeout = setTimeout(() => {
            toastPill.classList.remove("show");
          }, 1800);
        }

        function hideContextMenu() {
          contextMenu.style.display = "none";
        }

        function openContextMenu(x, y, item) {
          if (!item) return;

          // Show/hide context options depending on cipher data
          ctxTotp.style.display = item.hasTotp ? "flex" : "none";
          ctxUrl.style.display = item.hasUrl ? "flex" : "none";

          contextMenu.style.display = "flex";
          const rect = contextMenu.getBoundingClientRect();
          const maxX = window.innerWidth - rect.width - 8;
          const maxY = window.innerHeight - rect.height - 8;
          const finalX = Math.min(x, maxX);
          const finalY = Math.min(y, maxY);

          contextMenu.style.left = `${Math.max(8, finalX)}px`;
          contextMenu.style.top = `${Math.max(8, finalY)}px`;
        }

        async function copyField(cipherId, field) {
          if (!cipherId) return;
          try {
            if (window.ipc?.autofill?.autotypeMvp?.copyPickerField) {
              const res = await window.ipc.autofill.autotypeMvp.copyPickerField({
                cipherId,
                field,
              });
              showToast(res.message, res.success);
            }
          } catch {
            showToast("Ошибка при копировании", false);
          }
        }

        function editCipher(cipherId) {
          if (!cipherId) return;
          if (window.ipc?.autofill?.autotypeMvp?.editPickerCipher) {
            window.ipc.autofill.autotypeMvp.editPickerCipher({ cipherId });
          }
        }

        function selectItem(index) {
          const item = filteredItems[index];
          if (!item) return;

          if (window.ipc?.autofill?.autotypeMvp?.selectPicker) {
            window.ipc.autofill.autotypeMvp.selectPicker({ cipherId: item.id });
          }
        }

        function closePicker() {
          if (window.ipc?.autofill?.autotypeMvp?.closePicker) {
            window.ipc.autofill.autotypeMvp.closePicker();
          }
        }

        function renderItems() {
          resultsList.innerHTML = "";
          hideContextMenu();

          if (filteredItems.length === 0) {
            resultsList.innerHTML = `
            <div class="state-message">
              <div class="empty-icon">🔍</div>
              <div class="empty-title">Ничего не найдено</div>
              <div class="empty-subtitle">Попробуйте ввести другой поисковый запрос</div>
            </div>
          `;
            statusCount.textContent = "0 найдено";
            return;
          }

          statusCount.textContent = `${filteredItems.length} найдено`;

          filteredItems.forEach((item, index) => {
            const row = document.createElement("div");
            row.className = "cipher-item" + (index === selectedIndex ? " is-selected" : "");
            row.dataset.index = index;

            let badgeHtml = "";
            if (item.matchBadge) {
              const badgeClass =
                item.matchType === "process"
                  ? "badge-proc"
                  : item.matchType === "title"
                    ? "badge-title"
                    : "";
              badgeHtml = `<span class="match-badge ${badgeClass}">${escapeHtml(item.matchBadge)}</span>`;
            }

            const totpBtnHtml = item.hasTotp
              ? `<button class="action-btn btn-copy-totp" title="Скопировать код TOTP (Ctrl+T)" data-action="copy-totp">⏳</button>`
              : "";

            const urlBtnHtml = item.hasUrl
              ? `<button class="action-btn btn-copy-url" title="Скопировать URL (Ctrl+U)" data-action="copy-url">🔗</button>`
              : "";

            row.innerHTML = `
            <div class="item-icon-box">🔑</div>
            <div class="item-details">
              <div class="title-row">
                <span class="item-name">${escapeHtml(item.name || "Без названия")}</span>
                ${badgeHtml}
              </div>
              <div class="sub-row">
                <span class="item-username">${escapeHtml(item.username || "Без логина")}</span>
                <span class="item-sequence">${escapeHtml(item.sequencePreview || "{USERNAME} ⇥ {PASSWORD} ↵")}</span>
              </div>
            </div>
            <div class="item-actions">
              <button class="action-btn btn-autotype" title="Автонабор (Enter)" data-action="autotype">⌨️</button>
              <button class="action-btn btn-copy-username" title="Скопировать логин (Ctrl+B)" data-action="copy-username">👤</button>
              <button class="action-btn btn-copy-password" title="Скопировать пароль (Ctrl+C)" data-action="copy-password">🔑</button>
              ${totpBtnHtml}
              ${urlBtnHtml}
              <button class="action-btn btn-edit" title="Редактировать запись (Ctrl+E)" data-action="edit">✏️</button>
            </div>
          `;

            // Row click = AutoType
            row.addEventListener("click", (e) => {
              const btn = e.target.closest(".action-btn");
              if (btn) {
                e.stopPropagation();
                const action = btn.dataset.action;
                handleItemAction(item, action);
                return;
              }
              selectItem(index);
            });

            // Right-click context menu
            row.addEventListener("contextmenu", (e) => {
              e.preventDefault();
              e.stopPropagation();
              selectedIndex = index;
              updateSelection();
              openContextMenu(e.clientX, e.clientY, item);
            });

            resultsList.appendChild(row);
          });

          scrollToSelected();
        }

        function handleItemAction(item, action) {
          if (!item) return;
          switch (action) {
            case "autotype":
              selectItem(selectedIndex);
              break;
            case "copy-username":
              copyField(item.id, "username");
              break;
            case "copy-password":
              copyField(item.id, "password");
              break;
            case "copy-totp":
              copyField(item.id, "totp");
              break;
            case "copy-url":
              copyField(item.id, "url");
              break;
            case "edit":
              editCipher(item.id);
              break;
          }
        }

        function scrollToSelected() {
          const selectedEl = resultsList.querySelector(".cipher-item.is-selected");
          if (selectedEl) {
            selectedEl.scrollIntoView({ block: "nearest" });
          }
        }

        function applyFilter() {
          const q = searchInput.value.trim().toLowerCase();

          if (!q) {
            if (mode === "picker") {
              const matches = allItems.filter(
                (i) => i.matchType === "process" || i.matchType === "title",
              );
              filteredItems = matches.length > 0 ? matches : [...allItems];
            } else {
              filteredItems = [...allItems];
            }
          } else {
            filteredItems = allItems.filter((i) => {
              return (
                (i.name && i.name.toLowerCase().includes(q)) ||
                (i.username && i.username.toLowerCase().includes(q)) ||
                (i.matchBadge && i.matchBadge.toLowerCase().includes(q))
              );
            });
          }

          selectedIndex = 0;
          renderItems();
        }

        function escapeHtml(str) {
          if (!str) return "";
          return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
        }

        function updateSelection() {
          const items = resultsList.querySelectorAll(".cipher-item");
          items.forEach((el, idx) => {
            if (idx === selectedIndex) {
              el.classList.add("is-selected");
            } else {
              el.classList.remove("is-selected");
            }
          });
          scrollToSelected();
        }

        // Event Listeners
        searchInput.addEventListener("input", () => {
          clearSearchBtn.style.display = searchInput.value ? "block" : "none";
          applyFilter();
        });

        clearSearchBtn.addEventListener("click", () => {
          searchInput.value = "";
          clearSearchBtn.style.display = "none";
          searchInput.focus();
          applyFilter();
        });

        closeBtn.addEventListener("click", closePicker);

        // Context menu action clicks
        contextMenu.addEventListener("click", (e) => {
          const itemEl = e.target.closest(".context-item");
          if (!itemEl) return;
          const action = itemEl.dataset.action;
          hideContextMenu();
          if (
            filteredItems.length > 0 &&
            selectedIndex >= 0 &&
            selectedIndex < filteredItems.length
          ) {
            handleItemAction(filteredItems[selectedIndex], action);
          }
        });

        // Hide context menu on global click or blur
        window.addEventListener("click", (e) => {
          if (!e.target.closest("#contextMenu")) {
            hideContextMenu();
          }
        });

        // Keyboard navigation and KeePassXC copy/edit shortcuts
        window.addEventListener("keydown", (e) => {
          // If context menu is open, Escape closes it
          if (e.key === "Escape") {
            e.preventDefault();
            if (contextMenu.style.display === "flex") {
              hideContextMenu();
              return;
            }
            closePicker();
            return;
          }

          // F2 = Edit selected cipher
          if (e.key === "F2") {
            e.preventDefault();
            if (
              filteredItems.length > 0 &&
              selectedIndex >= 0 &&
              selectedIndex < filteredItems.length
            ) {
              editCipher(filteredItems[selectedIndex].id);
            }
            return;
          }

          // Ctrl / Meta shortcuts (supporting Russian layout)
          if (e.ctrlKey || e.metaKey) {
            const k = e.key.toLowerCase();
            const code = e.code;

            // Ctrl+B = Copy Username
            if (code === "KeyB" || k === "b" || k === "и") {
              e.preventDefault();
              if (
                filteredItems.length > 0 &&
                selectedIndex >= 0 &&
                selectedIndex < filteredItems.length
              ) {
                copyField(filteredItems[selectedIndex].id, "username");
              }
              return;
            }

            // Ctrl+C = Copy Password (if no text selected in search input)
            if (code === "KeyC" || k === "c" || k === "с") {
              if (
                document.activeElement === searchInput &&
                searchInput.selectionStart !== searchInput.selectionEnd
              ) {
                // User has highlighted text in the search input, let native copy happen
                return;
              }
              e.preventDefault();
              if (
                filteredItems.length > 0 &&
                selectedIndex >= 0 &&
                selectedIndex < filteredItems.length
              ) {
                copyField(filteredItems[selectedIndex].id, "password");
              }
              return;
            }

            // Ctrl+T = Copy TOTP
            if (code === "KeyT" || k === "t" || k === "е") {
              e.preventDefault();
              if (
                filteredItems.length > 0 &&
                selectedIndex >= 0 &&
                selectedIndex < filteredItems.length
              ) {
                copyField(filteredItems[selectedIndex].id, "totp");
              }
              return;
            }

            // Ctrl+U = Copy URL
            if (code === "KeyU" || k === "u" || k === "г") {
              e.preventDefault();
              if (
                filteredItems.length > 0 &&
                selectedIndex >= 0 &&
                selectedIndex < filteredItems.length
              ) {
                copyField(filteredItems[selectedIndex].id, "url");
              }
              return;
            }

            // Ctrl+E = Edit Cipher
            if (code === "KeyE" || k === "e" || k === "у") {
              e.preventDefault();
              if (
                filteredItems.length > 0 &&
                selectedIndex >= 0 &&
                selectedIndex < filteredItems.length
              ) {
                editCipher(filteredItems[selectedIndex].id);
              }
              return;
            }
          }

          if (e.key === "ArrowDown") {
            e.preventDefault();
            hideContextMenu();
            if (filteredItems.length > 0) {
              selectedIndex = (selectedIndex + 1) % filteredItems.length;
              updateSelection();
            }
            return;
          }

          if (e.key === "ArrowUp") {
            e.preventDefault();
            hideContextMenu();
            if (filteredItems.length > 0) {
              selectedIndex = (selectedIndex - 1 + filteredItems.length) % filteredItems.length;
              updateSelection();
            }
            return;
          }

          if (e.key === "Enter") {
            e.preventDefault();
            hideContextMenu();
            if (
              filteredItems.length > 0 &&
              selectedIndex >= 0 &&
              selectedIndex < filteredItems.length
            ) {
              selectItem(selectedIndex);
            }
          }
        });

        // IPC initialization listener
        if (window.ipc?.autofill?.autotypeMvp?.onPickerInitData) {
          window.ipc.autofill.autotypeMvp.onPickerInitData((data) => {
            targetWindow = data.targetWindow || null;
            mode = data.mode || "picker";
            allItems = data.items || [];

            if (targetWindow) {
              targetProc.textContent = targetWindow.processName || "Процесс";
              targetTitle.textContent = targetWindow.windowTitle || "Целевое окно";
              targetProc.style.display = targetWindow.processName ? "inline-block" : "none";
            } else {
              targetProc.textContent = "";
              targetTitle.textContent = "AutoType Spotlight";
            }

            if (data.useTcato) {
              tcatoBadge.classList.add("visible");
            } else {
              tcatoBadge.classList.remove("visible");
            }

            searchInput.value = data.initialQuery || "";
            clearSearchBtn.style.display = searchInput.value ? "block" : "none";

            applyFilter();

            setTimeout(() => {
              searchInput.focus();
              searchInput.select();
            }, 30);
          });
        }
      })();
    </script>
  </body>
</html>
